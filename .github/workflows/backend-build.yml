name: Container builds

on:
  workflow_dispatch:
    inputs:
      publish_backend:
        description: Publish an immutable backend image for deployment
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build both services
        run: docker compose build

  publish-backend:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish backend for both server architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: dorukgezici/subabot:v2-${{ github.sha }}
          cache-from: type=gha,scope=subabot-backend
          cache-to: type=gha,mode=max,scope=subabot-backend
