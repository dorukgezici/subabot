[project]
name = "subabot"
version = "1.0.0"
description = "A quiet signal inbox for the topics that matter, with RSS monitoring and Slack delivery"
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [{ name = "Doruk Gezici", email = "doruk@gezici.me" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "uvicorn>=0.37.0,<1",
    "aiohttp>=3.14.4,<4",
    "fastapi>=0.143.0,<0.144",
    "starlette>=1.7.0,<2",
    "feedparser>=6.0.12,<7",
    "sqlmodel>=0.0.48,<0.1",
    "pydantic>=2.14.0,<3",
    "pydantic-settings>=2.11.0,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "httpx2>=2.0.0,<3",
]

[project.scripts]
start = "subabot.api:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subabot"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
