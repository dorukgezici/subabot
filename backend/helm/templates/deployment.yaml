{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) }}
{{- fail "image.digest must be an immutable sha256 digest" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subabot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "subabot.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "subabot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "subabot.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subabot
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: SUBABOT_DATABASE_URL
              value: sqlite:////data/subabot.db
            - name: SUBABOT_FRONTEND_URL
              value: {{ .Values.frontendUrl | quote }}
            - name: SUBABOT_SCHEDULER_ENABLED
              value: "true"
            - name: SUBABOT_SCAN_INTERVAL_SECONDS
              value: {{ .Values.scanIntervalSeconds | quote }}
            - name: SUBABOT_SCAN_COOLDOWN_SECONDS
              value: {{ .Values.scanCooldownSeconds | quote }}
            - name: SUBABOT_TRUST_PROXY_CLIENT_IP
              value: "true"
            - name: SUBABOT_PROXY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "gatewaySecret.name is required" .Values.gatewaySecret.name | quote }}
                  key: {{ required "gatewaySecret.key is required" .Values.gatewaySecret.key | quote }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: subabot-data
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
