apiVersion: v1
kind: Service
metadata:
  name: subabot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "subabot.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: {{ printf "%s-subabot@kubernetescrd" .Release.Namespace | quote }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "subabot.selectorLabels" . | nindent 4 }}
